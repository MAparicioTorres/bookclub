spring:
  application:
    name: bookclub

  logging:
    level:
      org.springframework.security: DEBUG

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: bookclub
        format_sql: true
    show-sql: true
